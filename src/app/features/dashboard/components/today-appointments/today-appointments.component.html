<div class="today-card">
  <div class="section-title">
    <mat-icon>today</mat-icon>
    Agendamentos de hoje
  </div>

  <div class="appointments-list" *ngIf="appointments.length > 0; else empty">
    <a class="appointment-item"
       *ngFor="let appt of appointments"
       [routerLink]="['/appointments', appt.id]">
      <div class="appt-time">{{ formatTime(appt.scheduledTime) }}</div>
      <div class="appt-info">
        <div class="appt-client">{{ appt.clientName }}</div>
        <div class="appt-service">{{ appt.serviceName }}</div>
      </div>
      <span class="status-chip" [class]="'status-' + appt.status.toLowerCase()">
        {{ statusLabel(appt.status) }}
      </span>
    </a>
  </div>

  <ng-template #empty>
    <div class="empty-state">
      <mat-icon>event_available</mat-icon>
      <p>Nenhum agendamento hoje</p>
    </div>
  </ng-template>
</div>
