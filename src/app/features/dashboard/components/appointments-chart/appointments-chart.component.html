<div class="chart-card">
  <div class="chart-title">
    <span class="title-icon">📅</span>
    Agendamentos por período
  </div>
  <apx-chart
    [series]="chartSeries"
    [chart]="chart"
    [plotOptions]="plotOptions"
    [dataLabels]="dataLabels"
    [stroke]="stroke"
    [colors]="colors"
    [legend]="legend"
    [xaxis]="xaxis"
    [yaxis]="yaxis"
    [tooltip]="tooltip">
  </apx-chart>
</div>
