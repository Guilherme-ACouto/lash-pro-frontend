<div class="calendar-card">
  <div class="section-title">
    <mat-icon>calendar_month</mat-icon>
    Calendário
  </div>

  <div class="calendar-nav">
    <button class="nav-btn" (click)="prevMonth()">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <span class="month-label">{{ monthLabel }}</span>
    <button class="nav-btn" (click)="nextMonth()">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <div class="calendar-grid">
    <div class="weekday-header" *ngFor="let d of weekDays">{{ d }}</div>

    <ng-container *ngFor="let week of weeks">
      <div class="day-cell"
           *ngFor="let day of week"
           [class.today]="day.isToday"
           [class.has-appt]="day.hasAppointment"
           [class.clickable]="day.hasAppointment"
           [class.empty]="!day.dayNumber"
           (click)="onDayClick(day)">
        <span class="day-num" *ngIf="day.dayNumber">{{ day.dayNumber }}</span>
        <span class="appt-dot" *ngIf="day.hasAppointment"></span>
      </div>
    </ng-container>
  </div>
</div>
