<div class="dashboard-wrapper">

  <!-- Cabeçalho -->
  <div class="dashboard-header">
    <div class="greeting">
      <div class="greeting-top">
        <h1>{{ greeting }}<span *ngIf="currentUser$ | async as user">, {{ user.name.split(' ')[0] }}</span>!</h1>
        <span class="today-badge">Hoje, {{ today | datePtbr:'long' }}</span>
      </div>
      <p class="subtitle">Aqui está o resumo do seu estúdio</p>
    </div>
    <div class="header-actions">
      <div class="period-tabs">
        <button class="period-btn"
                *ngFor="let p of periodOptions"
                [class.active]="(period$ | async) === p.value"
                (click)="setPeriod(p.value)">
          {{ p.label }}
        </button>
      </div>
    </div>
  </div>

  <!-- Carregar -->
  <div *ngIf="loading$ | async" class="loading-row">
    <div class="skeleton-card" *ngFor="let i of [1,2,3,4,5,6]"></div>
  </div>

  <ng-container *ngIf="!(loading$ | async)">

    <!-- KPI cards -->
    <div class="kpi-grid" *ngIf="kpis$ | async as kpis">
      <app-kpi-card
        icon="people"
        label="Clientes ativos"
        [value]="kpis.activeClients"
        [trend]="kpis.clientsGrowth"
        color="var(--color-primary)">
      </app-kpi-card>

      <app-kpi-card
        icon="event"
        label="Agendamentos"
        [value]="kpis.totalAppointments"
        color="var(--color-primary)">
      </app-kpi-card>

      <app-kpi-card
        icon="attach_money"
        label="Faturado no período"
        [value]="kpis.revenue"
        prefix="R$"
        color="var(--color-status-confirmed-text)">
      </app-kpi-card>

      <app-kpi-card
        icon="cancel"
        label="Cancelamentos"
        [value]="kpis.cancellations"
        color="var(--color-status-noshow-text)">
      </app-kpi-card>

      <app-kpi-card
        icon="schedule"
        label="A receber"
        [value]="kpis.receivable"
        prefix="R$"
        color="var(--color-status-scheduled-text)">
      </app-kpi-card>

      <app-kpi-card
        icon="receipt_long"
        label="A pagar"
        [value]="kpis.payable"
        prefix="R$"
        color="var(--color-primary-hover)">
      </app-kpi-card>
    </div>

    <!-- Gráfico de barras -->
    <app-appointments-chart
      [series]="(appointmentsSeries$ | async) ?? []">
    </app-appointments-chart>

    <!-- Linha inferiror -->
    <div class="bottom-row">
      <app-cash-flow-chart
        class="cash-flow"
        [series]="(cashFlowSeries$ | async) ?? []">
      </app-cash-flow-chart>

      <app-today-appointments
        [appointments]="(todayAppointments$ | async) ?? []">
      </app-today-appointments>
    </div>

  </ng-container>
</div>
