server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy das chamadas de API para o backend (nome do serviço no docker-compose).
    # DNS do Docker via variável + resolver: reresolve o IP a cada 10s, evitando
    # que o Nginx fique preso a um IP antigo se o container do backend reiniciar.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Angular: qualquer rota que não seja arquivo real cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
